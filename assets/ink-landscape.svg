<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- Original ink-wash landscape (shanshui style): misty peaks, a river, and a scholar under a pine on the near bank. -->
  <defs>
    <filter id="brush" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16"/>
    </filter>
    <filter id="wash"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d636b" stop-opacity=".55"/><stop offset=".75" stop-color="#5d636b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3237" stop-opacity=".9"/><stop offset=".55" stop-color="#3f4247" stop-opacity=".45"/><stop offset="1" stop-color="#3f4247" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a38" stop-opacity=".7"/><stop offset="1" stop-color="#3a3a38" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2925" stop-opacity=".85"/><stop offset="1" stop-color="#2b2925" stop-opacity=".35"/>
    </linearGradient>
  </defs>

  <!-- distant range -->
  <path filter="url(#wash)" fill="url(#far)" d="M0 470 C90 420 170 380 250 400 C320 330 400 290 470 350 C540 300 610 310 660 370 C730 330 800 340 860 390 C930 350 1000 360 1060 400 L1060 900 L0 900Z"/>

  <!-- monumental peaks, right -->
  <g filter="url(#brush)">
    <path fill="url(#peak)" d="M960 660 C1010 560 1050 430 1110 340 C1150 260 1190 200 1235 245 C1265 175 1310 120 1360 190 C1400 140 1460 160 1500 235 C1545 300 1580 340 1600 380 L1600 900 L960 900Z"/>
    <path fill="url(#peak)" opacity=".6" d="M1080 700 C1120 600 1160 520 1210 470 C1250 420 1290 430 1320 480 C1360 440 1410 450 1450 520 C1500 590 1540 640 1600 660 L1600 900 L1080 900Z"/>
  </g>
  <!-- texture strokes (cun) -->
  <g stroke="#2a2c30" stroke-opacity=".35" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#soft)">
    <path d="M1240 250 C1230 300 1215 350 1205 420"/><path d="M1360 195 C1350 260 1345 330 1330 400"/>
    <path d="M1470 220 C1480 280 1475 340 1490 410"/><path d="M1150 330 C1140 380 1130 430 1120 500"/>
    <path d="M1300 300 C1290 340 1295 380 1280 430"/><path d="M1420 260 C1415 310 1425 350 1410 400"/>
  </g>

  <!-- left hills -->
  <path filter="url(#brush)" fill="url(#hill)" d="M0 610 C70 540 150 515 230 548 C290 485 370 470 440 540 C490 585 530 610 580 650 L580 760 L0 760Z"/>

  <!-- river ripples -->
  <g stroke="#3d4650" stroke-opacity=".3" stroke-width="1.4" stroke-linecap="round" fill="none">
    <path d="M620 712 h70"/><path d="M760 724 h110"/><path d="M930 716 h60"/><path d="M700 742 h90"/>
    <path d="M880 750 h130"/><path d="M1060 738 h80"/><path d="M640 770 h60"/><path d="M820 780 h100"/>
    <path d="M1000 772 h70"/><path d="M1150 760 h90"/><path d="M760 806 h120"/><path d="M960 812 h90"/>
  </g>

  <!-- small boat with a fisherman -->
  <g transform="translate(1010 728)" fill="#2b2925" opacity=".7">
    <path d="M-34 0 C-20 9 20 9 36 -2 C14 3 -14 3 -34 0Z"/>
    <path d="M6 -2 L4 -16 L12 -16 L10 -2Z"/><circle cx="8" cy="-19" r="3"/>
    <path d="M10 -14 L46 -40" stroke="#2b2925" stroke-width="1.2"/>
  </g>

  <!-- near bank -->
  <path filter="url(#brush)" fill="url(#bank)" d="M0 770 C110 735 250 722 400 748 C500 765 590 790 680 830 C720 850 740 880 750 900 L0 900Z"/>
  <g fill="#262420" opacity=".75" filter="url(#brush)">
    <path d="M60 790 C80 760 130 755 150 785 C140 805 80 810 60 790Z"/>
    <path d="M520 800 C540 780 580 785 590 810 C570 822 530 820 520 800Z"/>
  </g>

  <!-- pine -->
  <g>
    <path d="M250 770 C245 700 270 640 255 580 C245 540 265 500 290 470" stroke="#25221e" stroke-width="9" fill="none" stroke-linecap="round" filter="url(#brush)"/>
    <path d="M258 640 C300 620 340 615 380 600" stroke="#25221e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M262 560 C220 540 190 530 160 532" stroke="#25221e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M285 480 C320 465 350 462 380 470" stroke="#25221e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g fill="#1f2a22" opacity=".8" filter="url(#brush)">
      <ellipse cx="380" cy="592" rx="62" ry="16"/><ellipse cx="320" cy="606" rx="44" ry="12"/>
      <ellipse cx="160" cy="524" rx="52" ry="14"/><ellipse cx="215" cy="536" rx="34" ry="10"/>
      <ellipse cx="370" cy="462" rx="54" ry="14"/><ellipse cx="295" cy="458" rx="40" ry="12"/>
    </g>
  </g>

  <!-- scholar on the bank, gazing across the river -->
  <g transform="translate(455 762)">
    <path d="M-2 -46 L14 -46 L12 -40 L0 -40Z" fill="#1d1b18"/>
    <circle cx="6" cy="-35" r="6" fill="#e9e2d4" stroke="#1d1b18" stroke-width="1.4"/>
    <path d="M-6 -27 C-12 -10 -16 6 -20 18 L30 18 C26 4 22 -12 18 -27 C12 -31 0 -31 -6 -27Z" fill="#ece6d8" stroke="#1d1b18" stroke-width="1.6"/>
    <path d="M16 -22 C30 -16 36 -8 40 2 C32 0 24 -6 18 -12" fill="#ece6d8" stroke="#1d1b18" stroke-width="1.4"/>
    <path d="M-4 -12 L22 -12" stroke="#1d1b18" stroke-width="1"/>
    <path d="M-16 -20 L-24 22" stroke="#1d1b18" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- geese -->
  <g stroke="#2b2925" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".6">
    <path d="M880 250 l8 5 l8 -5"/><path d="M910 236 l7 4 l7 -4"/><path d="M936 248 l6 4 l6 -4"/>
  </g>

  <!-- seal -->
  <g transform="translate(1250 840)" opacity=".75">
    <rect x="-22" y="-22" width="44" height="44" rx="3" fill="#b0323a"/>
    <text x="0" y="9" text-anchor="middle" font-size="26" fill="#f6eee6" font-family="serif">櫻</text>
  </g>
</svg>
