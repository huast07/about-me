<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sterling Huang</title>
<meta name="description" content="Sterling Huang's story as a sakura tree growing through the seasons, one highlight per branch.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="page">
<!-- Content lives in js/content.js. The tree, seasons and finale are generated by js/tree.js. -->
<div id="sky"></div>
<div id="backdrop" aria-hidden="true">
  <div id="ink"></div>
  <div id="verses"></div>
</div>
<canvas id="tree" aria-hidden="true"></canvas>
<main id="world"></main>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="spacer"></div>

<nav aria-label="Highlights"><ol class="hud" id="rail"></ol></nav>
<button class="hud" id="season" type="button" aria-label="Explore the current season"></button>

</div>
<div class="hud" id="topbar">
  <a class="brand" href="index.html">Sterling Huang</a>
  <div class="music-controls">
    <button class="chip" id="musicBtn" aria-pressed="false"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="t">Play music</span></button>
    <details class="music-credit"><summary aria-label="About the music">♫</summary><div>
      <strong>Winter — Largo</strong><br>Vivaldi · The Four Seasons<br>
      John Harrison, violin · Robert Turizziani, conductor · Wichita State University Chamber Players.<br>
      <a href="https://commons.wikimedia.org/wiki/File:11_-_Vivaldi_Winter_mvt_2_Largo_-_John_Harrison_violin.ogg" target="_blank" rel="noopener">Recording &amp; source</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>
    </div></details>
  </div>
</div>
<p id="musicStatus" class="sr" role="status"></p>
<script src="js/content.js"></script>
<script src="js/seasons.js"></script>
<script src="js/backdrop.js"></script>
<script src="js/tree.js"></script>
<script src="js/music.js"></script>
<script src="js/navigation.js"></script>
</body>
</html>
