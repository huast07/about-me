<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sterling Huang - Velut Arbor Aevo</title>
<meta name="description" content="Sterling Huang's story as a sakura tree growing through the seasons, one highlight per branch.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Content lives in js/content.js. The tree, seasons and finale are generated by js/tree.js. -->
<div id="sky"></div>
<canvas id="tree" aria-hidden="true"></canvas>
<main id="world"></main>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="spacer"></div>

<div class="hud" id="topbar">
  <a class="brand" href="#" id="toSeed">Sterling Huang</a>
  <button class="chip" id="musicBtn" aria-pressed="false"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="t">Music</span><span class="sr"> toggle generative music</span></button>
</div>
<nav aria-label="Highlights"><ol class="hud" id="rail"></ol></nav>
<div class="hud" id="season" aria-live="polite"></div>

<script src="js/content.js"></script>
<script src="js/seasons.js"></script>
<script src="js/music.js"></script>
<script src="js/tree.js"></script>
</body>
</html>
